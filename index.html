<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<title>바코드 조회</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>바코드 조회</h1>
    <p class="admin-badge" id="adminBadge" hidden>관리자 모드 · 상품을 바로 고칠 수 있어요</p>
    <p class="sub">카메라로 바코드나 포장을 비추기만 하면 상품과 용량별 가격을 보여줘요.</p>
  </header>

  <section class="scanner" aria-label="스캐너">
    <div class="viewport" id="viewport" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="guide" aria-hidden="true"><span></span></div>
    </div>
    <p class="status" id="status" role="status">아래 버튼을 눌러 시작하세요.</p>
    <div class="actions">
      <button class="primary" id="btnCamera" type="button">카메라로 찾기</button>
      <label class="secondary" for="photo">바코드 사진 찍기</label>
      <input id="photo" type="file" accept="image/*" capture="environment" hidden>
      <label class="secondary wide" for="packPhoto" id="packLabel">포장 사진으로 찾기 (영어 이름)</label>
      <input id="packPhoto" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <form class="manual" id="manual" autocomplete="off">
      <input id="manualCode" inputmode="numeric" placeholder="바코드 번호 직접 입력" aria-label="바코드 번호">
      <button type="submit">조회</button>
    </form>
  </section>

  <section id="result" class="result" aria-live="polite" hidden></section>

  <section id="register" class="card register" hidden>
    <h2 id="regTitle">이 바코드 등록하기</h2>
    <p class="hint" id="regHint">등록한 상품은 이 기기에만 저장돼요.</p>
    <form id="regForm">
      <label>바코드<input id="regCode" inputmode="numeric" readonly></label>
      <label>상품명<input id="regName" required placeholder="예: 토우 훈제연어&amp;고구마 독 2kg"></label>
      <label class="admin-only">영문명 (포장의 영어 이름)<input id="regEnglish" placeholder="예: Taste of the Wild Pacific Stream Canine"></label>
      <label>가격<input id="regPrice" placeholder="예: 18,000원"></label>
      <label>메모 (선택)<input id="regMemo"></label>
      <label>상품 사진 (선택)<input id="regImage" type="file" accept="image/*"></label>
      <div class="row">
        <button class="primary" type="submit" id="regSave">저장</button>
        <button class="ghost" type="button" id="regCancel">취소</button>
      </div>
    </form>
  </section>

  <section class="card" id="historyCard" hidden>
    <h2>최근 조회</h2>
    <ul id="history" class="history"></ul>
  </section>

  <details class="card admin">
    <summary>데이터 관리</summary>
    <p class="hint" id="dataInfo"></p>
    <form id="adminForm" class="sheet" autocomplete="off" hidden>
      <label for="adminPin">관리자 비밀번호</label>
      <input id="adminPin" type="password" inputmode="numeric" autocomplete="current-password">
      <div class="row"><button class="primary" type="submit">관리자로 들어가기</button></div>
    </form>
    <div id="adminOn" class="row" hidden>
      <button class="ghost" type="button" id="btnLogout">관리자 나가기</button>
    </div>
    <form id="sheetForm" class="sheet" autocomplete="off">
      <label for="sheetUrl">구글시트 주소 (이 기기에만 적용)</label>
      <input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/…">
      <div class="row">
        <button class="primary" type="submit">저장하고 불러오기</button>
        <button class="ghost" type="button" id="btnReload">새로고침</button>
      </div>
    </form>
    <div class="row">
      <button class="ghost" type="button" id="btnExport">내가 등록한 상품 복사</button>
      <button class="ghost danger" type="button" id="btnClearMine">내가 등록한 상품 지우기</button>
    </div>
    <textarea id="exportBox" readonly hidden></textarea>
  </details>
</main>
<script src="settings.js"></script>
<script src="vendor/zxing-0.21.3.min.js"></script>
<script src="vendor/tesseract/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
